name: GitHub Pages mirror check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pages-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build portfolio
        run: bash build-cloudflare.sh

      - name: Prepare GitHub Pages mirror
        run: node scripts/prepare-github-pages.mjs

      - name: Verify Pages output
        run: |
          test -f dist/.nojekyll
          test -f dist/index.html
          test -f dist/assets/og-default-pages.png
          grep -q 'https://jpelotea.github.io/jc-professional-portfolio/assets/og-default-pages.png' dist/index.html
          grep -q 'href="/jc-professional-portfolio/work/"' dist/index.html
          ! grep -q 'analytics-events' dist/index.html
