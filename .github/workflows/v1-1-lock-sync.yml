name: v1.1.0 lockfile sync

on:
  push:
    branches:
      - v1.1.0-content-semantic

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v1.1.0-content-semantic

      - name: Sync root lockfile version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '1.1.0';
          lock.packages[''].version = '1.1.0';
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync v1.1.0 lockfile version'
          git push origin HEAD:v1.1.0-content-semantic
