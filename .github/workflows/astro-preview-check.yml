name: Astro preview check

on:
  push:
    branches:
      - astro-haze-migration
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro build
        run: bash build-cloudflare.sh
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/work/index.html
          test -f dist/work/avodah/index.html
          test -f dist/work/openready/index.html
          test -f dist/work/ice-zeta/index.html
          test -f dist/work/konnevia/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/_headers
          test -d dist/assets
          test -f dist/assets/og-default.png
          test -f dist/assets/og-ice-zeta.png
          test -f dist/assets/og-konnevia.png
