name: Bootstrap image dimensions

on:
  push:
    branches:
      - v1.0.1-maintenance

permissions:
  contents: write

jobs:
  dimensions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read source image dimensions
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import sharp from 'sharp';

          const assets = [
            'assets/avodah-website-proof.webp',
            'assets/openready.svg',
            'assets/ice-zeta-website-2026-08.webp',
            'assets/konnevia-website-2026-08.png',
            'assets/avodah-ops-proof.webp',
            'assets/avodah-creative-proof.webp'
          ];

          const dimensions = {};
          for (const asset of assets) {
            const metadata = await sharp(asset).metadata();
            dimensions[`/${asset}`] = { width: metadata.width, height: metadata.height };
          }

          await writeFile('IMAGE_DIMENSIONS.json', `${JSON.stringify(dimensions, null, 2)}\n`);
          NODE
      - name: Commit temporary dimension report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE_DIMENSIONS.json
          if git diff --cached --quiet; then
            echo "Dimension report already current"
            exit 0
          fi
          git commit -m "Record source image dimensions"
          git push
