<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Avodah campaign execution controlled composite</title>
  <desc id="desc">Three coordinated financial education campaign layouts covering protection, savings, insurance, and OFW planning.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/><stop offset="1" stop-color="#e9eee6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234d35"/><stop offset="1" stop-color="#61923c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b57d29"/><stop offset="1" stop-color="#e5bd59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173326" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1120" height="630" fill="url(#canvas)"/>
  <path d="M0 500C220 416 360 576 577 514s353-180 543-102v218H0Z" fill="#254d35" opacity=".08"/>
  <circle cx="1030" cy="70" r="150" fill="#d2b14d" opacity=".10"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(54 50)">
      <path d="M19 0 38 35H0Z" fill="#31593d"/><path d="m19 10 9 17H10Z" fill="#c89c37"/>
      <text x="49" y="18" fill="#274934" font-size="18" font-weight="700" letter-spacing="2">AVODAH</text>
      <text x="49" y="35" fill="#738078" font-size="9" letter-spacing="2.2">WEALTH ADVISORY</text>
    </g>
    <text x="1066" y="70" text-anchor="end" fill="#6f7c74" font-size="10" letter-spacing="1.8">CONTROLLED CAMPAIGN COMPOSITE</text>

    <g filter="url(#shadow)">
      <g transform="translate(54 112)">
        <rect width="308" height="452" rx="24" fill="#fff"/>
        <path d="M0 0h308v96c-80 35-163-5-308 40Z" fill="url(#green)"/>
        <circle cx="252" cy="52" r="76" fill="#fff" opacity=".08"/>
        <text x="24" y="39" fill="#fff" font-size="10" letter-spacing="1.5">FINANCIAL WELLNESS</text>
        <text x="24" y="66" fill="#fff" font-size="22" font-weight="700">Protect. Grow.</text>
        <text x="24" y="91" fill="#f3cf6a" font-size="22" font-weight="700">Prosper.</text>
        <g transform="translate(24 166)">
          <circle cx="130" cy="92" r="84" fill="#edf3e9"/>
          <path d="M130 16c49 0 87 42 87 92 0 40-27 74-64 86-24-41-45-73-96-102 7-44 37-76 73-76Z" fill="#345d3e" opacity=".18"/>
          <circle cx="104" cy="72" r="25" fill="#d6b060"/>
          <path d="M58 166c8-56 30-76 70-76s65 22 78 76Z" fill="#31593d"/>
          <circle cx="174" cy="82" r="20" fill="#e3bd6c"/>
          <path d="M142 166c5-42 22-62 53-62 27 0 44 21 51 62Z" fill="#829e61"/>
          <path d="M34 168h212" stroke="#d9e2d5"/>
        </g>
        <text x="24" y="374" fill="#294936" font-size="16" font-weight="700">A plan built around real life.</text>
        <text x="24" y="398" fill="#6f7b73" font-size="11">Protection, savings, and long-term</text>
        <text x="24" y="414" fill="#6f7b73" font-size="11">goals working as one system.</text>
        <rect x="24" y="428" width="112" height="8" rx="4" fill="#c8a241"/>
      </g>

      <g transform="translate(406 84)">
        <rect width="308" height="480" rx="24" fill="#fff"/>
        <rect width="308" height="120" rx="24" fill="#f7f3e9"/>
        <rect y="96" width="308" height="24" fill="#f7f3e9"/>
        <text x="24" y="38" fill="#294936" font-size="10" letter-spacing="1.5">FINANCIAL EDUCATION</text>
        <text x="24" y="71" fill="#20382a" font-size="25" font-weight="700">Savings</text>
        <text x="130" y="71" fill="#a17727" font-size="14" font-weight="700">VS</text>
        <text x="160" y="71" fill="#20382a" font-size="25" font-weight="700">Insurance</text>
        <text x="24" y="96" fill="#748078" font-size="10">Two tools. Different jobs. One resilient plan.</text>
        <g transform="translate(24 145)">
          <rect width="124" height="204" rx="18" fill="#eef4ea"/>
          <circle cx="62" cy="54" r="31" fill="#dbe8d4"/>
          <path d="M37 54h50M62 29v50" stroke="#4f7b3a" stroke-width="8" stroke-linecap="round"/>
          <text x="62" y="112" text-anchor="middle" fill="#31593d" font-size="15" font-weight="700">SAVINGS</text>
          <text x="62" y="139" text-anchor="middle" fill="#6f7c73" font-size="10">Liquidity</text>
          <text x="62" y="157" text-anchor="middle" fill="#6f7c73" font-size="10">Short-term goals</text>
          <text x="62" y="175" text-anchor="middle" fill="#6f7c73" font-size="10">Emergency access</text>
          <rect x="22" y="187" width="80" height="5" rx="3" fill="#79a64f"/>
          <rect x="136" width="124" height="204" rx="18" fill="#fbf4e5"/>
          <path d="M198 22 230 38v31c0 22-13 39-32 48-19-9-32-26-32-48V38Z" fill="#e6c56f"/>
          <path d="m185 65 9 9 19-23" fill="none" stroke="#6f511c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="198" y="112" text-anchor="middle" fill="#7c5b21" font-size="15" font-weight="700">INSURANCE</text>
          <text x="198" y="139" text-anchor="middle" fill="#7f7665" font-size="10">Protection</text>
          <text x="198" y="157" text-anchor="middle" fill="#7f7665" font-size="10">Income continuity</text>
          <text x="198" y="175" text-anchor="middle" fill="#7f7665" font-size="10">Long-term security</text>
          <rect x="158" y="187" width="80" height="5" rx="3" fill="#c89c37"/>
        </g>
        <rect x="24" y="378" width="260" height="62" rx="14" fill="#233f2e"/>
        <text x="42" y="405" fill="#fff" font-size="12" font-weight="700">The stronger answer is often both.</text>
        <text x="42" y="424" fill="#c6d5c8" font-size="9">Match each tool to the risk it is designed to handle.</text>
      </g>

      <g transform="translate(758 112)">
        <rect width="308" height="452" rx="24" fill="#fff"/>
        <path d="M0 0h308v146c-85-18-192-62-308 18Z" fill="url(#gold)"/>
        <circle cx="244" cy="72" r="58" fill="#fff" opacity=".16"/>
        <path d="M223 72h42M244 51v42" stroke="#fff" stroke-width="5" opacity=".75"/>
        <text x="24" y="37" fill="#fff" font-size="10" letter-spacing="1.5">PLANNING FOR OFWs</text>
        <text x="24" y="74" fill="#263d2f" font-size="25" font-weight="700">Build today.</text>
        <text x="24" y="104" fill="#fff" font-size="25" font-weight="700">Protect tomorrow.</text>
        <g transform="translate(24 183)">
          <path d="M30 86C76 25 137 3 226 30" fill="none" stroke="#dce8d8" stroke-width="22" stroke-linecap="round"/>
          <path d="M30 86C76 25 137 3 226 30" fill="none" stroke="#5d8744" stroke-width="5" stroke-linecap="round"/>
          <circle cx="42" cy="77" r="25" fill="#ddb765"/><path d="M0 172c4-58 22-80 58-80s58 26 64 80Z" fill="#2d5338"/>
          <circle cx="113" cy="67" r="21" fill="#e3bd6c"/><path d="M78 172c5-57 24-82 58-82 32 0 51 27 56 82Z" fill="#7c985f"/>
          <circle cx="184" cy="76" r="24" fill="#d9ae57"/><path d="M146 172c5-58 25-81 61-81 33 0 54 26 59 81Z" fill="#b4862e"/>
        </g>
        <text x="24" y="378" fill="#294936" font-size="16" font-weight="700">A future your family can count on.</text>
        <text x="24" y="402" fill="#6f7b73" font-size="11">Clear goals, protection priorities,</text>
        <text x="24" y="418" fill="#6f7b73" font-size="11">and a plan that travels with you.</text>
        <rect x="24" y="432" width="112" height="8" rx="4" fill="#31593d"/>
      </g>
    </g>
  </g>
</svg>
