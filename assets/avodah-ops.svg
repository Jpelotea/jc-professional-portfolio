      <stop offset="0" stop-color="#111922"/>
      <stop offset="1" stop-color="#172a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bbd3a"/>
      <stop offset="1" stop-color="#d8ab35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020609" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1120" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="-10" r="220" fill="#8bbd3a" opacity=".07"/>
  <circle cx="1020" cy="640" r="280" fill="#d8ab35" opacity=".05"/>

