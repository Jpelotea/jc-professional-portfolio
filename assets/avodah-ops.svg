        <rect x="106" width="76" height="48" rx="10" fill="#f8f2e5"/><text x="144" y="21" text-anchor="middle" fill="#8a6720" font-size="9" font-weight="700">INTERVIEW</text><text x="144" y="38" text-anchor="middle" fill="#1e2b2d" font-size="14" font-weight="700">6</text>
