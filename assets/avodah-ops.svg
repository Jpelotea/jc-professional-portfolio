    <circle cx="89" cy="262" r="5" fill="#5e7778"/><text x="104" y="266">Recruitment</text>
    <circle cx="89" cy="308" r="5" fill="#5e7778"/><text x="104" y="312">Calendar</text>
    <circle cx="89" cy="354" r="5" fill="#5e7778"/><text x="104" y="358">Reporting</text>
