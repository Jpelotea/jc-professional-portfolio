<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Avodah operations systems controlled composite</title>
  <desc id="desc">A polished dashboard-style composite showing operating metrics, recruitment workflow, activity monitoring, and calendar coordination.</desc>
  <defs>
