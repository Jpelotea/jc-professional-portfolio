        <rect y="30" width="254" height="23" rx="7" fill="#263b3e"/><text x="10" y="46" fill="#a8bbb9">14:00</text><text x="58" y="46" fill="#fff">Applicant interviews</text><circle cx="239" cy="41.5" r="4" fill="#d5ab3d"/>
        <rect y="60" width="254" height="23" rx="7" fill="#263b3e"/><text x="10" y="76" fill="#a8bbb9">16:30</text><text x="58" y="76" fill="#fff">Weekly reporting</text><circle cx="239" cy="71.5" r="4" fill="#668e92"/>
