<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenReady product controlled composite</title>
  <desc id="desc">A repository readiness product interface with an assessment score, release checklist, documentation status, and roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#122942"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39d6c4"/><stop offset="1" stop-color="#4ea8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000812" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1120" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="70" r="260" fill="#4ea8ff" opacity=".08"/><circle cx="90" cy="620" r="240" fill="#39d6c4" opacity=".06"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="52" y="48" width="1016" height="534" rx="28" fill="#f7fafc"/>
    <rect x="52" y="48" width="1016" height="68" rx="28" fill="#0c2133"/><rect x="52" y="88" width="1016" height="28" fill="#0c2133"/>
    <g transform="translate(78 67)"><rect width="28" height="28" rx="8" fill="url(#cyan)"/><path d="m8 15 5 5 8-11" fill="none" stroke="#062034" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="20" fill="#fff" font-size="18" font-weight="700">OpenReady</text></g>
    <text x="882" y="88" fill="#9bb1c3" font-size="10">PUBLIC ASSESSMENT</text><rect x="983" y="69" width="56" height="28" rx="14" fill="#163c4b"/><circle cx="998" cy="83" r="4" fill="#39d6c4"/><text x="1008" y="87" fill="#a9eee5" font-size="9" font-weight="700">LIVE</text>

    <rect x="76" y="140" width="236" height="418" rx="20" fill="#102638"/>
    <text x="98" y="174" fill="#fff" font-size="13" font-weight="700">Repository workspace</text><text x="98" y="194" fill="#89a1b3" font-size="9">jcpelotea / openready</text>
    <g transform="translate(98 225)">
      <rect width="192" height="45" rx="11" fill="#19394d"/><circle cx="18" cy="22" r="5" fill="#39d6c4"/><text x="32" y="26" fill="#fff" font-size="11" font-weight="700">Assessment</text>
      <circle cx="18" cy="92" r="5" fill="#536f83"/><text x="32" y="96" fill="#a8bac7" font-size="11">Documentation</text>
      <circle cx="18" cy="140" r="5" fill="#536f83"/><text x="32" y="144" fill="#a8bac7" font-size="11">Community health</text>
      <circle cx="18" cy="188" r="5" fill="#536f83"/><text x="32" y="192" fill="#a8bac7" font-size="11">Release readiness</text>
      <circle cx="18" cy="236" r="5" fill="#536f83"/><text x="32" y="240" fill="#a8bac7" font-size="11">Roadmap</text>
    </g>
    <rect x="98" y="494" width="192" height="42" rx="11" fill="#0b1d2c" stroke="#28475b"/><text x="114" y="519" fill="#8ea6b7" font-size="10">Last reviewed</text><text x="270" y="519" text-anchor="end" fill="#fff" font-size="10" font-weight="700">Today</text>

    <g transform="translate(338 140)">
      <text x="0" y="22" fill="#12283a" font-size="20" font-weight="700">Readiness overview</text><text x="0" y="44" fill="#728494" font-size="10">A practical path from repository setup to a maintainable public release</text>
      <g transform="translate(0 72)">
        <rect width="236" height="170" rx="18" fill="#fff" stroke="#dce5eb"/>
        <text x="20" y="31" fill="#506473" font-size="10" letter-spacing="1">OVERALL SCORE</text>
        <circle cx="87" cy="96" r="48" fill="none" stroke="#e6eef2" stroke-width="13"/>
        <path d="M87 48a48 48 0 1 1-43 27" fill="none" stroke="url(#cyan)" stroke-width="13" stroke-linecap="round"/>
        <text x="87" y="105" text-anchor="middle" fill="#10283b" font-size="28" font-weight="700">82</text>
        <text x="156" y="83" fill="#193447" font-size="12" font-weight="700">Release-ready</text><text x="156" y="103" fill="#728494" font-size="9">7 checks remain</text><rect x="156" y="119" width="58" height="25" rx="12" fill="#e7f9f6"/><text x="185" y="136" text-anchor="middle" fill="#16796f" font-size="9" font-weight="700">+9 pts</text>
      </g>
      <g transform="translate(256 72)">
        <rect width="438" height="170" rx="18" fill="#fff" stroke="#dce5eb"/>
        <text x="20" y="31" fill="#193447" font-size="13" font-weight="700">Priority checklist</text><text x="408" y="31" text-anchor="end" fill="#658091" font-size="9">4 OF 6 COMPLETE</text>
        <g font-size="10">
          <circle cx="27" cy="63" r="9" fill="#dff7f3"/><path d="m23 63 3 3 6-7" fill="none" stroke="#17877b" stroke-width="2"/><text x="46" y="67" fill="#2a4050">README explains purpose and setup</text><rect x="340" y="53" width="69" height="20" rx="10" fill="#edf2f5"/><text x="374" y="67" text-anchor="middle" fill="#5e7180" font-size="8">DOCS</text>
          <circle cx="27" cy="98" r="9" fill="#dff7f3"/><path d="m23 98 3 3 6-7" fill="none" stroke="#17877b" stroke-width="2"/><text x="46" y="102" fill="#2a4050">Contribution path is documented</text><rect x="340" y="88" width="69" height="20" rx="10" fill="#edf2f5"/><text x="374" y="102" text-anchor="middle" fill="#5e7180" font-size="8">COMMUNITY</text>
          <circle cx="27" cy="133" r="9" fill="#fff4d9"/><circle cx="27" cy="133" r="3" fill="#b87a18"/><text x="46" y="137" fill="#2a4050">Add automated link validation</text><rect x="340" y="123" width="69" height="20" rx="10" fill="#fff4d9"/><text x="374" y="137" text-anchor="middle" fill="#9a671a" font-size="8">NEXT</text>
        </g>
      </g>

      <g transform="translate(0 262)">
        <rect width="438" height="156" rx="18" fill="#fff" stroke="#dce5eb"/>
        <text x="20" y="30" fill="#193447" font-size="13" font-weight="700">Assessment coverage</text>
        <g transform="translate(20 52)" font-size="9">
          <text y="10" fill="#5f7483">Documentation</text><rect x="105" width="285" height="10" rx="5" fill="#e8eff3"/><rect x="105" width="245" height="10" rx="5" fill="#39c9ba"/>
          <text y="39" fill="#5f7483">Community</text><rect x="105" y="29" width="285" height="10" rx="5" fill="#e8eff3"/><rect x="105" y="29" width="205" height="10" rx="5" fill="#55aaf4"/>
          <text y="68" fill="#5f7483">Release</text><rect x="105" y="58" width="285" height="10" rx="5" fill="#e8eff3"/><rect x="105" y="58" width="230" height="10" rx="5" fill="#7a8df0"/>
          <text y="97" fill="#5f7483">Security</text><rect x="105" y="87" width="285" height="10" rx="5" fill="#e8eff3"/><rect x="105" y="87" width="176" height="10" rx="5" fill="#d09a43"/>
        </g>
      </g>
      <g transform="translate(458 262)">
        <rect width="236" height="156" rx="18" fill="#10283b"/>
        <text x="18" y="29" fill="#fff" font-size="13" font-weight="700">Roadmap</text><text x="218" y="29" text-anchor="end" fill="#7f9aae" font-size="9">Q3</text>
        <g font-size="9"><circle cx="23" cy="61" r="5" fill="#39d6c4"/><text x="38" y="65" fill="#d8e5ec">Assessment v1</text><text x="218" y="65" text-anchor="end" fill="#6f899a">DONE</text><circle cx="23" cy="94" r="5" fill="#4ea8ff"/><text x="38" y="98" fill="#d8e5ec">Shareable reports</text><text x="218" y="98" text-anchor="end" fill="#76baf7">ACTIVE</text><circle cx="23" cy="127" r="5" fill="#4a6476"/><text x="38" y="131" fill="#a8bbc7">Team workspace</text><text x="218" y="131" text-anchor="end" fill="#6f899a">NEXT</text></g>
      </g>
    </g>
  </g>
</svg>
